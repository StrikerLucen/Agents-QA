[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testsquad-fixture-shop"
version = "0.0.0"
description = "testsquad eval fixture. Planted defects are recorded in ../MANIFEST.json."
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["shop"]
branch = true
